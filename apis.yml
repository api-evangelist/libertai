aid: libertai
name: LibertAI
description: 'LibertAI provides private, TEE-attested AI inference on the decentralized
  Aleph Cloud network through an OpenAI-compatible API at api.libertai.io: text (chat
  completions), image, embeddings, audio and web search APIs over leading open models
  such as GLM-5.3, with no KYC, no prompt logging, API keys from the developer console
  or keyless pay-per-request x402 payments in USDC on Base, plus an agents framework.'
